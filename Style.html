<style>
:root{--bg:#17191D;--panel:#202329;--black:#101114;--gold:#C5A15B;--gray:#9298A3;--white:#F4F4F4;--line:#2C3038;--danger:#D2695F;--ok:#8FB58A;--r:8px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--black);color:var(--white);font:14px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Manrope,Inter,sans-serif;margin:0;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
/* sidebar */
.sidebar{width:236px;background:var(--black);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;flex-shrink:0;transition:width .15s}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;font:700 16px Manrope,sans-serif}
.logo{width:32px;height:32px;border-radius:8px;background:var(--gold);color:var(--black);display:grid;place-items:center;font-weight:800;flex-shrink:0}
#nav{padding:6px 10px;display:flex;flex-direction:column;gap:2px}
.nav-i{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r);color:var(--gray);cursor:pointer;border:0;background:none;text-align:left;width:100%;border-left:2px solid transparent}
.nav-i svg{width:18px;height:18px;flex-shrink:0}
.nav-i:hover{color:var(--white);background:var(--bg)}
.nav-i.active{color:var(--gold);background:var(--bg);border-left-color:var(--gold)}
.sidebar.collapsed{width:68px}
.sidebar.collapsed .brand-t,.sidebar.collapsed .nav-t{display:none}
.sidebar.collapsed .nav-i{justify-content:center;padding:10px 0}
.main{flex:1;min-width:0;background:var(--bg)}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.topbar h1{font-size:18px}.topdate{margin-left:auto;color:var(--gray);font-size:13px}
.icon-btn{background:none;border:1px solid var(--line);border-radius:var(--r);width:36px;height:36px;cursor:pointer;color:var(--gray);display:grid;place-items:center;font-size:20px;line-height:1}
.icon-btn:hover{color:var(--gold);border-color:var(--gold)}.icon-btn svg{width:18px;height:18px}
#content{padding:24px;max-width:1400px}
.page-head{margin-bottom:18px}.page-head h2{font-size:22px}.page-head p{margin:4px 0 0;color:var(--gray)}
/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h3{font-size:15px;margin-bottom:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.stat{padding:14px 16px}.stat .lbl{display:block;color:var(--gray);font-size:12px}
.stat .val{display:block;font:700 24px Manrope,sans-serif;margin-top:4px}
.stat.gold .val{color:var(--gold)}
.grid-2{display:grid;grid-template-columns:minmax(300px,440px) 1fr;gap:16px;align-items:start}
.grid-p{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
/* forms */
.form{display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:6px}.fld>label{color:var(--gray);font-size:12px;font-weight:500}
input,select,textarea{background:var(--black);border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
input[type=date]{color-scheme:dark}
.info{min-height:20px;color:var(--gray);font-size:13px}.info b{color:var(--gold)}
.hint{font-size:12px;color:var(--gray)}.warn{color:var(--danger);font-size:12px;min-height:16px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:9px 16px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--black);font-weight:600}
.btn.primary:hover{filter:brightness(1.08);color:var(--black)}
.btn.danger{border-color:var(--danger);color:var(--danger)}.btn.danger.fill{background:var(--danger);color:var(--black)}
.btn.sm{padding:4px 10px;font-size:12px}.btn:disabled{opacity:.55;cursor:not-allowed}
.toolbar,.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:14px}
.toolbar input,.toolbar select,.filters input,.filters select{width:auto;min-width:150px}
.toolbar .grow{flex:1;min-width:200px}
.inline{display:flex;align-items:center;gap:8px;color:var(--gray)}
/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;white-space:nowrap}
th{background:var(--black);color:var(--gold);text-align:left;font-weight:600;padding:10px 12px;font-size:12px;border-bottom:1px solid var(--gold)}
td{padding:9px 12px;border-bottom:1px solid var(--line)}
tbody tr:nth-child(even){background:#1b1e23}tbody tr:hover{background:#262a31}tbody tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums}
td.mut{color:var(--gray)}td.wrap{white-space:normal;min-width:160px}
.badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;border:1px solid var(--line);color:var(--gray);margin-left:6px}
.badge.gold{color:var(--gold);border-color:var(--gold)}.badge.red{color:var(--danger);border-color:var(--danger)}.badge.green{color:var(--ok);border-color:var(--ok)}
.pos{color:var(--ok)}.neg{color:var(--danger)}
.act{display:flex;gap:6px}
.pager{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:12px;color:var(--gray)}
/* bars */
.mov{display:flex;gap:10px;align-items:flex-end;height:150px}
.mov .d{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.mov .bars{display:flex;gap:3px;align-items:flex-end;height:120px;width:100%;justify-content:center}
.mov .b{width:40%;max-width:22px;border-radius:3px 3px 0 0;min-height:2px}
.mov .b.i{background:var(--gold)}.mov .b.o{background:var(--gray)}.mov small{color:var(--gray);font-size:11px}
.legend{display:flex;gap:14px;color:var(--gray);font-size:12px;margin-top:8px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.lowrow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}.lowrow:last-child{border:0}
/* states */
.loading,.empty{padding:34px;text-align:center;color:var(--gray)}
.empty b{display:block;color:var(--white);margin-bottom:4px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.errbox{padding:14px;border:1px solid var(--danger);border-radius:var(--r);color:var(--danger)}
/* toasts & modal */
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gold);padding:11px 15px;border-radius:var(--r);max-width:360px}
.toast.err{border-left-color:var(--danger)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);width:100%;max-width:460px;max-height:92vh;display:flex;flex-direction:column}
.modal.wide{max-width:900px}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.mbody{padding:18px;overflow:auto}.mfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.kv div{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px}.kv span{display:block;color:var(--gray);font-size:11px}.kv b{font-size:17px;font-family:Manrope,sans-serif}
.scrim{display:none}
@media(max-width:860px){
  .sidebar{position:fixed;left:-260px;z-index:40;width:236px!important;transition:left .15s}
  .sidebar.open{left:0}.sidebar.collapsed .brand-t,.sidebar.collapsed .nav-t{display:inline}
  .scrim.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30}
  #content{padding:14px}.grid-2{grid-template-columns:1fr}.topdate{display:none}
}
@media(max-width:860px){
  input,select,textarea{font-size:16px}
  .btn{min-height:42px}.btn.sm{min-height:36px;padding:6px 12px}
  .icon-btn{width:42px;height:42px}
  .nav-i{padding:13px 12px}
  .topbar{padding:10px 14px}.topbar h1{font-size:16px}
  .page-head h2{font-size:19px}
  .toolbar,.filters{align-items:stretch}
  .toolbar input,.toolbar select,.filters input,.filters select,.filters .fld{width:100%;min-width:0}
  .toolbar .btn,.filters .btn{flex:1}.toolbar .inline{width:100%}
  .cards{grid-template-columns:repeat(2,1fr);gap:10px}.stat .val{font-size:20px}
  .grid-p{grid-template-columns:1fr}.card{padding:14px}
  .overlay{align-items:end;padding:0}
  .modal,.modal.wide{max-width:100%;max-height:94vh;border-radius:14px 14px 0 0}
  .mfoot .btn{flex:1}
  #toasts{left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom))}.toast{max-width:none}
  .pager{flex-wrap:wrap;justify-content:space-between}
  body{padding-bottom:env(safe-area-inset-bottom)}
}
@media(max-width:380px){.cards{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:2s}}
</style>
